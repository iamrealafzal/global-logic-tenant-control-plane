services:
  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"

  controlplane:
    build: .
    image: controlplane:local
    command: ["python", "-m", "controlplane"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/controlplane.db
      NATS_URL: nats://nats:4222
      OUTBOX_INTERVAL: 500ms
    volumes:
      - sqlite-data:/data
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    image: controlplane:local
    command: ["python", "-m", "controlplane.worker"]
    environment:
      NATS_URL: nats://nats:4222
      FAIL_RATE: ${FAIL_RATE:-0}
      MIN_DELAY_MS: ${MIN_DELAY_MS:-500}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-1500}
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data:
  nats-data:
