[project]
name = "controlplane"
version = "1.0.0"
description = "Tenant provisioning control plane"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "nats-py>=2.11",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "httpx>=0.28",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controlplane*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["controlplane", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
