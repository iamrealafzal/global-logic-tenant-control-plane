name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install
        run: python -m pip install -e '.[dev]'
      - name: format, lint, test, audit
        run: make verify
